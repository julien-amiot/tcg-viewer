# SonarQube Docker Compose configuration
# Environment variables are loaded from the .env file in the project root
# See .env.example for all available variables

services:
  sonarqube:
    image: ${SONAR_DOCKER_IMAGE:-sonarqube:community}
    container_name: ${SONAR_CONTAINER_NAME:-sc-tcg-sonarqube}
    environment:
      - SONAR_JDBC_URL=${SONAR_JDBC_URL:-jdbc:postgresql://db:5432/sonar}
      - SONAR_JDBC_USERNAME=${SONAR_JDBC_USERNAME:-sonar}
      - SONAR_JDBC_PASSWORD=${SONAR_JDBC_PASSWORD:-sonar}
    ports:
      - "${SONAR_HOST_PORT:-9000}:9000"
    depends_on:
      - db
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

  db:
    image: postgres:16
    container_name: ${SONAR_DB_CONTAINER_NAME:-sc-tcg-sonarqube-db}
    environment:
      - POSTGRES_USER=${SONAR_JDBC_USERNAME:-sonar}
      - POSTGRES_PASSWORD=${SONAR_JDBC_PASSWORD:-sonar}
      - POSTGRES_DB=sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - postgresql_conf:/etc/postgresql

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  postgresql_data:
  postgresql_conf:
