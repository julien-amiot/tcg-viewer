name: Unit Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with Vitest
        run: |
          npx vitest --run \
            --pool=forks \
            --no-file-parallelism \
            --reporter=verbose \
            --coverage