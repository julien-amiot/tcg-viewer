# SonarQube Project Configuration
sonar.projectKey=sc-tcg-card-view
sonar.projectName=SC-TCG Card Viewer
sonar.projectVersion=0.1.0

# Authentication (use environment variable SONAR_TOKEN instead of hardcoding)
# sonar.login=<your-token-here>

# Source directories
sonar.sources=src
sonar.sourceEncoding=utf-8

# TypeScript analysis
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test coverage
sonar.coverage.exclusions=test/**,dist/**,node_modules/**
sonar.test.inclusions=test/unit/**/*.ts

# Exclusions
sonar.exclusions=dist/**,node_modules/**,**/*.spec.ts,**/*.test.ts

# Quality gate
sonar.qualitygate.wait=true
