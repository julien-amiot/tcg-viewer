# SonarQube Project Configuration
sonar.host.url=http://localhost:9000
sonar.projectKey=sc-tcg-card-view
sonar.projectName=SC-TCG Card Viewer
sonar.projectVersion=0.1.0

# Authentication handled via SONAR_TOKEN environment variable

# Source directories
sonar.sources=src
sonar.sourceEncoding=utf-8

# TypeScript analysis
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test coverage
sonar.coverage.exclusions=test/**,dist/**,node_modules/**,src/main.ts
sonar.test.inclusions=test/unit/**/*.ts

# Exclusions
sonar.exclusions=dist/**,node_modules/**,**/*.spec.ts,**/*.test.ts

# Quality gate
sonar.qualitygate.wait=true
